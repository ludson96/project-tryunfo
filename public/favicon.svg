<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo minimalista preto e branco -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#000000" stroke="#ffffff" stroke-width="2" />
  
  <!-- Carta inclinada de fundo -->
  <rect x="14" y="14" width="26" height="38" rx="2" fill="none" stroke="#666666" stroke-width="2" transform="rotate(-10 27 33)" />
  
  <!-- Carta principal frontal -->
  <rect x="24" y="12" width="26" height="38" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" transform="rotate(8 37 31)" />
  
  <!-- Detalhe interno da carta -->
  <rect x="28" y="16" width="18" height="12" rx="1" fill="#eeeeee" transform="rotate(8 37 31)" />
  
  <!-- Letra T maiúscula clássica (estilo tipografia editorial) -->
  <text x="37" y="44" font-family="'Raleway', Helvetica, sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle" transform="rotate(8 37 31)">T</text>
</svg>
